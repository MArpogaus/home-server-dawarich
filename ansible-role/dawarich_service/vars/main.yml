---
dawarich_service_config_defaults:
  TIME_ZONE: Etc/UTC
  WEB_CONCURRENCY: 1
  BACKGROUND_PROCESSING_CONCURRENCY: 3

dawarich_service_fixed_config:
  RAILS_ENV: production
  DATABASE_HOST: 127.0.0.1
  DATABASE_PORT: 5432
  DATABASE_USERNAME: dawarich
  DATABASE_NAME: dawarich
  REDIS_URL: redis://127.0.0.1:6379
  APPLICATION_HOSTS: "{{ [dawarich_service_hostname, '127.0.0.1', 'localhost'] | select | join(',') }}"
  APPLICATION_PROTOCOL: http

dawarich_service_memory_defaults:
  app: 1G
  sidekiq: 1G
  db: 512M
  redis: 128M
dawarich_service_cpu_defaults: {}

quadlet_service_required:
  service_port: '^[0-9]+$'
  dawarich_service_db_password: '^[0-9a-f]{32,}$'
  dawarich_service_secret_key_base: '^[0-9a-f]{64,}$'
quadlet_service_secrets:
  dawarich_service_db_password: "{{ dawarich_service_db_password }}"
  dawarich_service_secret_key_base: "{{ dawarich_service_secret_key_base }}"
quadlet_service_memory: "{{ dawarich_service_memory_defaults | combine(dawarich_service_memory) }}"
quadlet_service_cpu: "{{ dawarich_service_cpu_defaults | combine(dawarich_service_cpu) }}"
